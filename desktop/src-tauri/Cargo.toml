[package]
name = "crawlvora-desktop"
version = "8.1.4"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = "=2.7.6"

[dependencies]
tauri = "=2.12.7"
open = { version = "=5.4.5", default-features = false }

[features]
portable = ["dep:tempfile", "dep:sha2"]

[target.'cfg(windows)'.dependencies]
tempfile = { version = "=3.27.0", optional = true }
sha2 = { version = "=0.10.9", optional = true }

[profile.release]
strip = true
lto = "thin"
