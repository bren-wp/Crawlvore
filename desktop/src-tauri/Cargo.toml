[package]
name = "crawlvora-desktop"
version = "8.1.2"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = "=2.7.6"

[dependencies]
tauri = "=2.12.7"
tauri-plugin-opener = "=2.7.3"

[features]
portable = ["dep:tempfile"]

[target.'cfg(windows)'.dependencies]
tempfile = { version = "=3.27.0", optional = true }

[profile.release]
strip = true
lto = "thin"
