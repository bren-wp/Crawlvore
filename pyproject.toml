[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlvora-runtime"
version = "8.1.7"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["automation", "backup_replica", "backup_transfer", "bulk_io", "company_fields", "company_store", "core", "data_safety", "encrypted_backup", "field_export", "local_http_response", "local_http_routes", "local_http_security", "native_vault", "network", "portable_recovery", "protected_backups", "registry", "registry_access", "registry_bundle", "registry_client", "registry_export", "registry_integration", "registry_seed", "snapshot_diff", "workspace_integrity", "workspace_selection", "tvrtk_scraper", "crawlvora_mail", "update_verification", "local_server", "update_staging", "update_client", "update_trust", "native_client", "native_desktop", "duplicate_review", "legacy_cleanup", "native_sections", "native_transfer", "native_theme"]
