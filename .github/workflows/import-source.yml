name: Import verified source archive
on:
  push:
    branches: [initialize-crawlvora]
    paths: ['.github/workflows/import-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/initialize-crawlvora'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack source
        run: |
          python - <<'PY'
          import hashlib, pathlib, shutil, stat, zipfile
          archive = pathlib.Path('Crawlvora-8.0.0.zip')
          data = archive.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == '7c1f404c1aa9a8b10a3791a00849437e81daf2c0'
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  assert p.parts[0] == 'Crawlvora' and '..' not in p.parts and not p.is_absolute()
                  assert not stat.S_ISLNK(info.external_attr >> 16)
                  if info.is_dir(): continue
                  target = pathlib.Path(*p.parts[1:])
                  assert not any('private.json' in x or x == 'data' for x in target.parts)
                  if target == pathlib.Path('README.md'): target = pathlib.Path('docs/USER-GUIDE.md')
                  if target.parts[:2] == ('.github','workflows'): target = pathlib.Path('docs/ci') / target.name
                  assert not target.exists(), target
                  target.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(info) as src, target.open('wb') as dst: shutil.copyfileobj(src,dst)
          PY
      - name: Test source before importing
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          node --check static/app.js
      - name: Commit unpacked source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --stat
          git commit -m 'chore: import verified Crawlvora 8.0.0 source and branding'
          git push origin HEAD:initialize-crawlvora
