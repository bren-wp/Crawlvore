name: Production release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate tag, source and committed dependency locks
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git ls-files --error-unmatch package-lock.json desktop/src-tauri/Cargo.lock
          python tools/import_design_references.py --verify
          python - <<'PY'
          import json, pathlib, tomllib
          version=pathlib.Path('VERSION').read_text().strip()
          assert json.loads(pathlib.Path('package.json').read_text())['version']==version
          assert json.loads(pathlib.Path('desktop/src-tauri/tauri.conf.json').read_text())['version']==version
          assert tomllib.loads(pathlib.Path('desktop/src-tauri/Cargo.toml').read_text())['package']['version']==version
          PY
  quality:
    needs: validate
    uses: ./.github/workflows/quality.yml
  native:
    needs: validate
    uses: ./.github/workflows/native.yml
  endurance:
    needs: validate
    uses: ./.github/workflows/endurance.yml
  publish:
    needs: [quality, native, endurance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: Crawlvora-native-Windows
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: Crawlvora-native-Linux
          path: release
      - name: Create and verify complete release assets
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=Crawlvora/ -o release/Crawlvora-source.zip "$GITHUB_SHA"
          cd release
          for file in Portable.exe Setup.exe Crawlvora-Linux-x86_64.tar.gz Crawlvora-Linux-amd64.deb Crawlvora-source.zip; do
            test -s "$file"
          done
          sha256sum Portable.exe Setup.exe Crawlvora-Linux-x86_64.tar.gz Crawlvora-Linux-amd64.deb Crawlvora-source.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish complete tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Crawlvora $GITHUB_REF_NAME" --generate-notes release/Portable.exe release/Setup.exe release/Crawlvora-Linux-x86_64.tar.gz release/Crawlvora-Linux-amd64.deb release/Crawlvora-source.zip release/SHA256SUMS.txt
