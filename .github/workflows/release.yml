name: Production release
on:
  workflow_dispatch:
    inputs:
      distribution_reviewed:
        description: Confirm licence attribution and approved private registry distribution
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require reviewed private distribution
        env:
          DISTRIBUTION_REVIEWED: ${{ inputs.distribution_reviewed }}
          PRIVATE_REPOSITORY: ${{ github.event.repository.private }}
        run: |
          test "$DISTRIBUTION_REVIEWED" = true
          test "$PRIVATE_REPOSITORY" = true
      - name: Validate tag, source and committed dependency locks
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = tag
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git ls-files --error-unmatch package-lock.json desktop/src-tauri/Cargo.lock
          python tools/import_design_references.py --verify
          python - <<'PY'
          import json, pathlib, tomllib
          version=pathlib.Path('VERSION').read_text().strip()
          assert json.loads(pathlib.Path('package.json').read_text())['version']==version
          assert json.loads(pathlib.Path('desktop/src-tauri/tauri.conf.json').read_text())['version']==version
          assert tomllib.loads(pathlib.Path('desktop/src-tauri/Cargo.toml').read_text())['package']['version']==version
          PY
  quality:
    needs: validate
    uses: ./.github/workflows/quality.yml
    with:
      strict_visual: true
      retain_evidence: true
  vault:
    needs: validate
    uses: ./.github/workflows/vault-acceptance.yml
  registry:
    needs: validate
    uses: ./.github/workflows/live-api.yml
    secrets: inherit
  snapshot:
    needs: validate
    uses: ./.github/workflows/registry-bundle.yml
    secrets: inherit
  gb_snapshot:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -c "from gb_download import fetch_snapshot; print(fetch_snapshot('national-data/GB'))"
      - uses: actions/upload-artifact@v7
        with:
          name: verified-gb-registry-snapshot
          path: national-data/GB/
          retention-days: 1
  native:
    needs: [snapshot, gb_snapshot]
    uses: ./.github/workflows/native.yml
    with:
      publish_artifacts: true
      registry_bundle: true
      national_bundle: true
  endurance:
    needs: validate
    uses: ./.github/workflows/endurance.yml
  million_records:
    needs: validate
    uses: ./.github/workflows/million-records.yml
  publish:
    needs: [quality, native, endurance, vault, registry, million_records, snapshot]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: verified-public-registry-snapshot
          path: release/registry
      - uses: actions/download-artifact@v8
        with:
          name: Crawlvora-native-Windows
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: Crawlvora-native-Linux
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: verified-gb-registry-snapshot
          path: release/gb
      - name: Create and verify complete release assets
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=Crawlvora/ -o release/Crawlvora-source.zip "$GITHUB_SHA"
          python -c 'import pathlib,zipfile; root=pathlib.Path("wordpress"); folder=root/"crawlvora-business-directory"; z=zipfile.ZipFile("release/Crawlvora-WordPress.zip","w",zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root)) for p in sorted(folder.rglob("*")) if p.is_file()]; z.close()'
          cd release
          (cd registry && sha256sum -c SHA256SUMS.txt)
          python -c 'import json; json.dump({"HR":json.load(open("registry/registry-seed.json")),"GB":json.load(open("gb/manifest.json")),"windows_editions":{"Full":["HR","GB"],"HR":["HR"],"GB":["GB"],"Online":[]}},open("REGISTRY-MANIFEST.json","w"),indent=2)'
          files=(Portable.exe Setup.exe Portable-HR.exe Setup-HR.exe Portable-GB.exe Setup-GB.exe Portable-Online.exe Setup-Online.exe Crawlvora-Linux-x86_64.tar.gz Crawlvora-Linux-amd64.deb Crawlvora-source.zip REGISTRY-MANIFEST.json Crawlvora-WordPress.zip)
          for file in "${files[@]}"; do
            test -s "$file"
            test "$(stat -c %s "$file")" -lt 2147483648 || { echo "Release asset exceeds GitHub limit: $file"; exit 1; }
          done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Verify exact release matrix
        run: python tools/verify_release_assets.py release
      - name: Publish complete tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PRIVATE
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Crawlvora $GITHUB_REF_NAME" --generate-notes release/Portable.exe release/Setup.exe release/Portable-HR.exe release/Setup-HR.exe release/Portable-GB.exe release/Setup-GB.exe release/Portable-Online.exe release/Setup-Online.exe release/Crawlvora-Linux-x86_64.tar.gz release/Crawlvora-Linux-amd64.deb release/Crawlvora-source.zip release/REGISTRY-MANIFEST.json release/Crawlvora-WordPress.zip release/SHA256SUMS.txt
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/release.json"
          python tools/verify_release_assets.py release --remote "$RUNNER_TEMP/release.json"
          gh release edit "$GITHUB_REF_NAME" --draft=false
