name: Native secure vault acceptance
on:
  pull_request:
    paths: ['native_vault.py','protected_backups.py','backup_replica.py','portable_recovery.py','tests/test_native_vault.py','.github/workflows/vault-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_native_vault.py -v
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y dbus-x11 gnome-keyring libsecret-tools
      - name: Real isolated Secret Service session
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_RUNTIME_DIR="$HOME/runtime"
          mkdir -p "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- bash -euc '
            printf "%s" "synthetic isolated CI keyring passphrase" | gnome-keyring-daemon --unlock --components=secrets
            export CRAWLVORA_SECRET_SERVICE_TEST=1
            python -m unittest discover -s tests -p test_native_vault.py -v
          '
