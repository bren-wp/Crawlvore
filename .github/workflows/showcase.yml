name: English product screenshots
on:
  push:
    branches: [data-safety-release]
    paths: ['.github/workflows/showcase.yml', 'static/**', 'frontend/**', 'tools/visual_check.py']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: crawlvora-showcase
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/data-safety-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit; else npm install --ignore-scripts --no-audit; fi
          npm run typecheck
          npm run build:frontend
          python -m playwright install --with-deps chromium
      - name: Resolve exact Rust dependencies
        working-directory: desktop/src-tauri
        run: test -f Cargo.lock || cargo +stable generate-lockfile
      - run: python tools/visual_check.py
      - name: Verify English screenshot assets and update README
        run: |
          python - <<'PY'
          import pathlib
          names=['overview','directory','registry','jobs','data','analytics','settings','detail']
          labels=['Overview','Business Directory','Court Registry','Tasks & Schedule','Import & Export','Analytics & Reports','Settings','Company Profile']
          rows=['| '+labels[i]+' | '+labels[i+1]+' |\n|---|---|\n| !['+labels[i]+'](branding/en-'+names[i]+'-dark-1440-fixture.png) | !['+labels[i+1]+'](branding/en-'+names[i+1]+'-dark-1440-fixture.png) |' for i in range(0,len(names),2)]
          assert len(list(pathlib.Path('branding').glob('en-*-fixture.png')))==32
          for name in names:
              assert pathlib.Path('branding/en-'+name+'-dark-1440-fixture.png').is_file()
          readme=pathlib.Path('README.md')
          text=readme.read_text(encoding='utf-8')
          start='<!-- PRODUCT_SCREENSHOTS_START -->'
          end='<!-- PRODUCT_SCREENSHOTS_END -->'
          body='Actual application interface rendered in English with controlled sample data.\n\n'+'\n\n'.join(rows)
          text=text.split(start)[0]+start+'\n'+body+'\n'+end+text.split(end)[1]
          readme.write_text(text,encoding='utf-8')
          PY
      - name: Commit verified screenshots to the same pull request
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin data-safety-release
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git add README.md branding/en-*-fixture.png package-lock.json desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh English product screenshots and commit dependency locks'
          git push origin HEAD:data-safety-release
      - name: Verify the resulting exact branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run candidate.yml --ref data-safety-release
          gh workflow run vault-acceptance.yml --ref data-safety-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: english-product-screens
          path: branding/en-*-fixture.png
