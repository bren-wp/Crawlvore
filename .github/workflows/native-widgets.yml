name: WebView-free native migration
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/test_native_client.py'
      - 'requirements*.txt'
      - '.github/workflows/native-widgets.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}/src
jobs:
  widgets:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install -r requirements.txt -r requirements-native-build.txt
      - run: python -m unittest discover -s tests -p test_native_client.py -v
      - name: Native GUI smoke (Windows)
        if: runner.os == 'Windows'
        run: python src/native_desktop.py --native-smoke
      - name: Native GUI smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python src/native_desktop.py --native-smoke
      - name: Build migration executable without HTML assets
        run: python -m PyInstaller --paths src --noconfirm --clean --onefile --console --exclude-module webview --exclude-module playwright --name CrawlvoraNativePreview src/native_desktop.py
      - name: Packaged native smoke (Windows)
        if: runner.os == 'Windows'
        run: |
          & dist/CrawlvoraNativePreview.exe --native-smoke
          if ($LASTEXITCODE) { throw 'Native package failed' }
      - name: Packaged native smoke (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/CrawlvoraNativePreview --native-smoke
