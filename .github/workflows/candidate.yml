name: Verified desktop release candidate
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml
    with:
      retain_evidence: true
  native:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/native.yml
    with:
      publish_artifacts: true
  vault:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/vault-acceptance.yml
  publish:
    needs: [quality, native, vault]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: Crawlvora-native-Windows
          path: release
      - uses: actions/download-artifact@v8
        with:
          name: Crawlvora-native-Linux
          path: release
      - name: Validate non-distribution candidate assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git archive --format=zip --prefix=Crawlvora/ -o release/Crawlvora-source.zip "$GITHUB_SHA"
          python -c 'import pathlib,zipfile; root=pathlib.Path("wordpress"); folder=root/"crawlvora-business-directory"; z=zipfile.ZipFile("release/Crawlvora-WordPress.zip","w",zipfile.ZIP_DEFLATED); [z.write(p,p.relative_to(root)) for p in sorted(folder.rglob("*")) if p.is_file()]; z.close()'
          cd release
          printf '%s\n' '{"registry_bundle_included":false,"complete":false,"snapshot":null,"scope":null,"category_count":null,"subjects":null,"reason":"Public preview; complete registry snapshot not included or verified."}' > REGISTRY-MANIFEST.json
          files=(Portable.exe Setup.exe Portable-Online.exe Setup-Online.exe Crawlvora-Linux-amd64.deb Crawlvora-Linux-x86_64.tar.gz Crawlvora-source.zip REGISTRY-MANIFEST.json Crawlvora-WordPress.zip)
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Build separate code-only web package
        run: python tools/package_web.py web-release/Crawlvora-Web.zip --ref "$GITHUB_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: Crawlvora-Web
          path: web-release/Crawlvora-Web.zip
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: Crawlvora-verified-non-distribution-candidate
          path: release/
          if-no-files-found: error
          retention-days: 7
      - run: echo "Candidate archived; no incomplete GitHub Release will be published." >> "$GITHUB_STEP_SUMMARY"
