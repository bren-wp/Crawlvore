name: Verified desktop release candidate
on:
  workflow_dispatch:
    inputs:
      publish_public:
        description: Publish a new, verified Online application release (no national data)
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml
    with:
      retain_evidence: true
  native:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/native.yml
    with:
      publish_artifacts: true
  vault:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/vault-acceptance.yml
  publish:
    needs: [quality, native, vault]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Crawlvora-native-Windows
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Crawlvora-native-Linux
          path: release
      - name: Validate non-distribution candidate assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git archive --format=zip --prefix=Crawlvora/ -o release/Crawlvora-source.zip "$GITHUB_SHA" -- . ":(exclude)tvrtk_output.csv"
          python tools/package_wordpress.py release/Crawlvora-WordPress.zip --ref "$GITHUB_SHA"
          cd release
          printf '%s\n' '{"registry_bundle_included":false,"complete":false,"snapshot":null,"scope":null,"category_count":null,"subjects":null,"reason":"Online application candidate; no national registry snapshot included."}' > REGISTRY-MANIFEST.json
          files=(Portable-Online.exe Setup-Online.exe Crawlvora-Linux-amd64.deb Crawlvora-Linux-x86_64.tar.gz Crawlvora-source.zip REGISTRY-MANIFEST.json Crawlvora-WordPress.zip)
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Build separate code-only web package
        run: |
          python tools/package_web.py web-release/Crawlvora-Web.zip --ref "$GITHUB_SHA"
          python tools/package_web.py web-release/Crawlvora-Web-Upgrade.zip --ref "$GITHUB_SHA" --upgrade
          cd web-release
          sha256sum Crawlvora-Web.zip Crawlvora-Web-Upgrade.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Crawlvora-Web
          path: web-release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Crawlvora-verified-non-distribution-candidate
          path: release/
          if-no-files-found: error
          retention-days: 7
      - run: echo "Candidate archived; complete national-data distribution remains a separate release." >> "$GITHUB_STEP_SUMMARY"

  public_release:
    concurrency:
      group: public-online-publication
      cancel-in-progress: false
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a new version or explicit publication request
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          REQUESTED: ${{ inputs.publish_public }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$REQUESTED" != true ]; then
            if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE:VERSION"; then exit 0; fi
            previous="$(git show "$BEFORE:VERSION" | tr -d '\r\n')"
            if [ "$version" = "$previous" ]; then exit 0; fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.version.outputs.publish == 'true'
        with:
          name: Crawlvora-verified-non-distribution-candidate
          path: candidate-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: steps.version.outputs.publish == 'true'
        with:
          name: Crawlvora-Web
          path: web-assets
      - name: Verify code-only Online distribution
        if: steps.version.outputs.publish == 'true'
        run: python tools/public_release.py public-assets --candidate candidate-assets --web web-assets --source "$GITHUB_SHA" --version "${{ steps.version.outputs.version }}"
      - name: Publish stable Online application after draft asset verification
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION-online"
          cat > "$RUNNER_TEMP/public-notes.md" <<EOF
          ## Crawlvora $VERSION - Online
          Tested Windows and Linux application packages, without embedded national catalogs.

          - Resume interrupted registry downloads and repair missing records.
          - Check UK catalog updates without downloading the archive again.
          - Improved security, performance and bilingual web integration.

          Windows packages are unsigned and may trigger operating-system warnings.
          National catalogs require authorized acquisition. Existing local databases are preserved.
          Full, HR and GB offline bundles are not included. Complete national-data, strict original-design, and extended endurance acceptance remain separate.
          The web and WordPress files are code-only companion packages; production hosting and WPCS remediation remain separate.

          Source commit: $GITHUB_SHA
          EOF
          bash tools/publish_public_release.sh public-assets "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/public-notes.md"
