name: Four national editions
on:
  workflow_dispatch:
  push:
    branches: ['release/hr-en-snapshot-1370']
    paths: ['.github/workflows/national-editions.yml']
permissions:
  contents: read
concurrency:
  group: national-editions-1370
  cancel-in-progress: true
jobs:
  hr:
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Restore exact verified archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download registry-data-1370 --dir registry-archive
          (cd registry-archive && sha256sum -c SHA256SUMS.txt)
          python tools/restore_registry_archive.py registry-archive registry-bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-public-registry-snapshot
          path: registry-bundle/
          retention-days: 7
          if-no-files-found: error
  gb:
    if: github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Reserve disk space for national catalog
        run: |
          set -euo pipefail
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h .
          python -c "import shutil; assert shutil.disk_usage('.').free >= 20*1024**3, 'National catalog needs at least 20 GiB'"
      - run: python -c "from gb_download import fetch_snapshot; print(fetch_snapshot('national-data/GB'))"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-gb-registry-snapshot
          path: national-data/GB/
          retention-days: 7
          if-no-files-found: error
  quality:
    uses: ./.github/workflows/quality.yml
  hr_full:
    needs: hr
    uses: ./.github/workflows/native.yml
    with:
      publish_artifacts: true
      registry_bundle: true
      edition: HR
      language: hr
      artifact_suffix: '-HR-Full'
  en_full:
    needs: gb
    uses: ./.github/workflows/native.yml
    with:
      publish_artifacts: true
      national_bundle: true
      edition: GB
      language: en
      artifact_suffix: '-EN-Full'
  online:
    if: github.event.repository.private
    strategy:
      matrix:
        include:
          - language: hr
            suffix: '-HR-Online'
          - language: en
            suffix: '-EN-Online'
    uses: ./.github/workflows/native.yml
    with:
      publish_artifacts: true
      edition: Online
      language: ${{ matrix.language }}
      artifact_suffix: ${{ matrix.suffix }}
  publish:
    needs: [hr_full, en_full, online, quality]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: Crawlvora-native-*
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-public-registry-snapshot
          path: registry
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-gb-registry-snapshot
          path: gb
      - name: Assemble and verify exact matrix
        run: |
          set -euo pipefail
          mkdir release
          for variant in HR-Full EN-Full HR-Online EN-Online; do
            case "$variant" in HR-Full) old=HR;; EN-Full) old=GB;; *) old=Online;; esac
            for kind in Setup Portable; do
              cp "packages/Crawlvora-native-Windows-$variant/$kind-$old.exe" "release/$kind-$variant.exe"
            done
            for ext in deb tar.gz; do
              if [ "$ext" = deb ]; then arch=amd64; else arch=x86_64; fi
              cp "packages/Crawlvora-native-Linux-$variant/Crawlvora-Linux-$arch.$ext" "release/Crawlvora-Linux-$variant-$arch.$ext"
            done
          done
          cp registry/registry-seed.json release/REGISTRY-HR-MANIFEST.json
          cp gb/manifest.json release/REGISTRY-GB-MANIFEST.json
          git archive --format=zip --prefix=Crawlvora/ -o release/Crawlvora-source.zip "$GITHUB_SHA"
          cd release
          test "$(find . -type f | wc -l)" = 19
          for f in *; do test -s "$f"; test "$(stat -c %s "$f")" -lt 2147483648; done
          sha256sum * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish four tested editions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PRIVATE
          tag=v8.1.6-national-editions
          gh release create "$tag" --draft --prerelease --latest=false --target "$GITHUB_SHA" --title 'Crawlvora 8.1.6 — HR and EN editions' --notes 'Four separately tested national and database-free editions. HR Full: Croatian Court Registry snapshot 1370. EN Full: Companies House monthly live-register snapshot. Online variants contain no bundled catalog. Private distribution only; not a legal approval for public redistribution.' release/*
          gh release edit "$tag" --draft=false --prerelease --latest=false
          gh release view "$tag" --json isDraft,assets,url --jq 'select(.isDraft == false and (.assets|length)==20) | .url' | grep -q '^https://github.com/'
