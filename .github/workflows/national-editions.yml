name: Croatian desktop editions
on:
  workflow_dispatch:
  push:
    branches: [main, refactor/hr-only-desktop]
    paths: ['src/**', 'frontend/**', 'static/**', 'desktop/**', 'windows/**', 'linux/**', 'tools/**', 'tests/**', 'VERSION', 'tvrtk_scraper.py', '.github/workflows/national-editions.yml']
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}/src
concurrency:
  group: croatian-editions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hr:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Reserve space for verified snapshot
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .
      - name: Restore exact verified archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PRIVATE
          gh release download registry-data-1370 --dir registry-archive
          (cd registry-archive && sha256sum -c SHA256SUMS.txt)
          python tools/restore_registry_archive.py registry-archive registry-bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-public-registry-snapshot
          path: registry-bundle/
          retention-days: 7
          if-no-files-found: error
  quality:
    uses: ./.github/workflows/quality.yml
  vault:
    uses: ./.github/workflows/vault-acceptance.yml
  hr_full:
    needs: hr
    uses: ./.github/workflows/native.yml
    with:
      publish_artifacts: true
      registry_bundle: true
      edition: HR
      language: hr
      artifact_suffix: '-HR-Full'
  online:
    uses: ./.github/workflows/native.yml
    with:
      publish_artifacts: true
      edition: Online
      language: hr
      artifact_suffix: '-HR-Online'
  publish:
    needs: [hr_full, online, quality, vault]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: Crawlvora-native-*
          path: packages
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-public-registry-snapshot
          path: registry
      - name: Verify native acceptance and assemble eight packages
        run: |
          set -euo pipefail
          mkdir release receipts
          for variant in HR-Full HR-Online; do
            case "$variant" in HR-Full) old=HR;; *) old=Online;; esac
            cp "packages/Crawlvora-native-Windows-$variant/acceptance-$old.json" receipts/
            for kind in Setup Portable; do
              cp "packages/Crawlvora-native-Windows-$variant/$kind-$old.exe" "receipts/$kind-$old.exe"
              cp "receipts/$kind-$old.exe" "release/$kind-$variant.exe"
            done
            for ext in deb tar.gz; do
              if [ "$ext" = deb ]; then arch=amd64; else arch=x86_64; fi
              cp "packages/Crawlvora-native-Linux-$variant/Crawlvora-Linux-$arch.$ext" "release/Crawlvora-Linux-$variant-$arch.$ext"
            done
          done
          python -c 'import json; from pathlib import Path; m=json.load(open("registry/registry-seed.json")); assert m["snapshot"]=="1370" and m["rows"]==11831255 and m["subjects"]==392785; Path("receipts/manifest.json").write_text(json.dumps({"HR":m}))'
          python tools/edition_acceptance.py receipts --source "$GITHUB_SHA" --manifest receipts/manifest.json
          cp registry/registry-seed.json release/REGISTRY-HR-MANIFEST.json
          git archive --format=zip --prefix=Crawlvora/ -o release/Crawlvora-source.zip "$GITHUB_SHA"
          cd release
          test "$(find . -type f | wc -l)" = 10
          for f in *; do test -s "$f"; test "$(stat -c %s "$f")" -lt 2147483648; done
          sha256sum * > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish two verified desktop editions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)" = PRIVATE
          tag="v$(tr -d '\r\n' < VERSION)-hr"
          gh release create "$tag" --draft --prerelease --latest=false --target "$GITHUB_SHA" --title "Crawlvora $tag" --notes 'Croatian desktop editions: HR Full with verified snapshot 1370 and HR Online with no bundled records. Windows Setup and Portable; Linux DEB and TAR.GZ. Private distribution only.' release/*
          gh release view "$tag" --json assets > remote.json
          python -c 'import json,hashlib,pathlib; a=json.load(open("remote.json"))["assets"]; p=pathlib.Path("release"); assert {x["name"] for x in a}=={f.name for f in p.iterdir()}; assert all(x["size"]==(p/x["name"]).stat().st_size and x["digest"]=="sha256:"+hashlib.file_digest((p/x["name"]).open("rb"),"sha256").hexdigest() for x in a)'
          gh release edit "$tag" --draft=false --prerelease --latest=false
