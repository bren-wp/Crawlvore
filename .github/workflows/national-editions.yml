name: Croatian desktop editions
on:
  workflow_dispatch:
  push:
    branches: [main, refactor/hr-only-desktop]
    paths: ['src/**', 'frontend/**', 'static/**', 'desktop/**', 'windows/**', 'linux/**', 'tools/**', 'tests/**', 'VERSION', '.github/workflows/national-editions.yml']
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}/src
concurrency:
  group: croatian-editions-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release_contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography==50.0.2
      - run: python -m unittest discover -s tests -p test_complete_release.py -v
      - run: python -m unittest discover -s tests -p test_edition_acceptance.py -v
  quality:
    uses: ./.github/workflows/quality.yml
  vault:
    uses: ./.github/workflows/vault-acceptance.yml
  online:
    uses: ./.github/workflows/native.yml
    with:
      publish_artifacts: true
      edition: Online
      language: hr
      artifact_suffix: '-HR-Online'
  publish:
    needs: [online, quality, vault, release_contract]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: Crawlvora-native-*
          path: packages
      - name: Verify tested Windows and Linux packages without bundled data
        run: |
          set -euo pipefail
          mkdir release
          windows=packages/Crawlvora-native-Windows-HR-Online
          linux=packages/Crawlvora-native-Linux-HR-Online
          python -c 'from tools.edition_acceptance import verify_edition; import os; verify_edition("packages/Crawlvora-native-Windows-HR-Online",os.environ["GITHUB_SHA"],{},"Online"); verify_edition("packages/Crawlvora-native-Linux-HR-Online",os.environ["GITHUB_SHA"],{},"Online","Linux")'
          cp "$windows/Setup-Online.exe" release/Setup-HR-Online.exe
          cp "$windows/Portable-Online.exe" release/Portable-HR-Online.exe
          cp "$linux/Crawlvora-Linux-amd64.deb" release/Crawlvora-Linux-HR-Online-amd64.deb
          cp "$linux/Crawlvora-Linux-x86_64.tar.gz" release/Crawlvora-Linux-HR-Online-x86_64.tar.gz
          cp "$windows/Update.exe" release/Update.exe
          cp "$linux/crawlvora-update" release/crawlvora-update
          git archive --format=zip --prefix=Crawlvora/ -o release/Crawlvora-source.zip "$GITHUB_SHA"
          cd release
          test "$(find . -type f | wc -l)" = 7
          python ../tools/package_sizes.py . --release online
          for f in *; do test -s "$f"; test "$(stat -c %s "$f")" -lt 2147483648; done
      - name: Install release signing dependency
        run: python -m pip install cryptography==50.0.2
      - name: Sign release update manifest
        env:
          CRAWLVORA_UPDATE_SIGNING_KEY: ${{ secrets.CRAWLVORA_UPDATE_SIGNING_KEY }}
        run: |
          python tools/sign_release_updates.py release "$(tr -d '\r\n' < VERSION)" Online
          (cd release && sha256sum -- * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Verify complete signed release matrix
        run: python tools/complete_release.py release "$(tr -d '\r\n' < VERSION)" online
      - name: Publish one complete 11-file compact release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(tr -d '\r\n' < VERSION)-online"
          gh release create "$tag" --draft --prerelease --latest=false --target "$GITHUB_SHA" --title "Tvrtke $tag" --notes 'Tvrtke: Windows NSIS Setup i Portable EXE; Linux DEB i TAR.GZ portable. Svi paketi bez ugrađene baze. Osvježavanje podataka u programu uz ovlašteni pristup. Oba updatera i svih 11 obaveznih datoteka.' release/*
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name==\"$tag\" and .draft) | .id")"
          test -n "$id"
          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --paginate --slurp > remote.json
          python -c 'import json,hashlib,pathlib; a=[x for page in json.load(open("remote.json")) for x in page]; p=pathlib.Path("release"); assert {x["name"] for x in a}=={f.name for f in p.iterdir()}; assert all(x["size"]==(p/x["name"]).stat().st_size and x["digest"]=="sha256:"+hashlib.file_digest((p/x["name"]).open("rb"),"sha256").hexdigest() for x in a)'
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false -F prerelease=false -f make_latest=true --jq '.html_url'
