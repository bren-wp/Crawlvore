name: Authorized production registry check
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      SUDREG_CLIENT_ID:
        required: false
      SUDREG_CLIENT_SECRET:
        required: false
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Test official production API (one company record)
        env:
          SUDREG_CLIENT_ID: ${{ secrets.SUDREG_CLIENT_ID }}
          SUDREG_CLIENT_SECRET: ${{ secrets.SUDREG_CLIENT_SECRET }}
        run: python tools/live_registry_check.py
