name: Million-record performance
on:
  push:
    branches: [data-safety-release]
    paths: ['.github/workflows/million-records.yml', 'tools/performance_check.py']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - shell: bash
        run: |
          set -euo pipefail
          python tools/performance_check.py --records 1000000 | tee million-records.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          retention-days: 1
          name: million-records
          path: million-records.json
