name: Quality and security
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      retain_evidence:
        type: boolean
        default: false
      strict_visual:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-native-build.txt pip-audit bandit vulture pillow packaging
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
      - name: Validate JSON website
        run: |
          php -l webstranica/index.php
          php -l webstranica/catalog.php
          python -m unittest discover -s tests -p test_web_catalog.py -v
          python tools/web_http_acceptance.py
      - name: Validate WordPress plugin
        run: |
          find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/wordpress_catalog.php
          bash tools/wordpress_acceptance.sh
          bash tools/apache_storage_acceptance.sh
      - run: if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit; else npm install --ignore-scripts --no-audit; fi
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build:frontend
      - run: node --check static/app.js && node --check static/locale.js
      - run: python -m pip_audit --strict
      - run: python -m bandit -r . -x ./tests,./tools -ll
      - name: Source and normalized clone audit
        run: |
          set -euo pipefail
          python tools/source_audit.py --strict-deps | tee source-audit.json
          python tools/clone_review.py | tee clone-review.json
      - run: python -m vulture . --exclude tests,tools --min-confidence 90
      - name: Extended static audit evidence (review candidates)
        run: |
          python -m bandit -r . -x ./tests -f json -o bandit-extended.json --exit-zero
          python -m vulture . --exclude tests --min-confidence 60 > dead-code-candidates.txt || test "$?" -eq 3
      - run: python -m playwright install --with-deps chromium
      - run: python tools/ui_e2e.py
      - run: python tools/layout_acceptance.py layout-evidence
      - run: python tools/visual_check.py
      - run: python tools/pixel_diff.py > pixel-diff.json
      - name: Exact approved visual comparison (production only)
        if: inputs.strict_visual == true
        run: |
          python tools/import_design_references.py --verify
          python tools/pixel_diff.py --strict
      - run: python tools/performance_check.py --records 100000 > performance.json
      - name: Build verified shared-hosting candidate
        run: python tools/package_web.py "${{ runner.temp }}/Crawlvora-Web.zip" --ref "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name == 'pull_request'
        with:
          name: Crawlvora-Web-PR
          path: ${{ runner.temp }}/Crawlvora-Web.zip
          if-no-files-found: error
          retention-days: 7
      - name: Record audit evidence in job summary
        if: always()
        shell: bash
        run: |
          for report in source-audit.json clone-review.json pixel-diff.json performance.json layout-evidence/layout-report.json; do
            if [ -s "$report" ]; then
              { printf '\n### %s\n\n```json\n' "$report"; head -c 160000 "$report"; printf '\n```\n'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.retain_evidence == true
        with:
          name: quality-evidence
          retention-days: 1
          path: |
            package-lock.json
            source-audit.json
            bandit-extended.json
            dead-code-candidates.txt
            clone-review.json
            pixel-diff.json
            performance.json
            layout-evidence/layout-report.json
            branding/*fixture.png
  rust-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned RustSec auditor
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit native dependency lock
        run: cargo audit --file desktop/src-tauri/Cargo.lock
