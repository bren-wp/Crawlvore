name: Four-hour endurance
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  endurance:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/endurance.py --seconds 14400 > endurance.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: endurance-report
          path: endurance.json
