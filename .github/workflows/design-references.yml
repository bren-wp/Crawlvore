name: Import approved design references
on:
  push:
    branches: [data-safety-release]
    paths: ['Crawlvora-Design-References-10.zip']
  workflow_dispatch:
env:
  PYTHONPATH: ${{ github.workspace }}/src
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/data-safety-release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify and import ten approved reference images
        run: python tools/import_design_references.py Crawlvora-Design-References-10.zip
      - name: Commit originals and remove transport archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add branding/references
          git rm Crawlvora-Design-References-10.zip
          git commit -m 'design: import ten approved Crawlvora reference PNGs'
          git push origin HEAD:data-safety-release
