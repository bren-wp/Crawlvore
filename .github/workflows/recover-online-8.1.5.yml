name: Recover verified Online 8.1.5 publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-online-8.1.5.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: public-online-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: a43d4467e3b04348f271ead19a0a1ac0754e3328
      ORIGINAL_RUN: '45929260255'
      VERSION: '8.1.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm original accepted build and draft identity
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE" "$GITHUB_SHA"
          test "$(git show "$SOURCE:VERSION" | tr -d '\r\n')" = "$VERSION"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" > "$RUNNER_TEMP/original-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN/jobs?per_page=100" > "$RUNNER_TEMP/original-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/460105848" > "$RUNNER_TEMP/original-draft.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          run=json.loads((root/"original-run.json").read_text())
          assert run["head_sha"]==os.environ["SOURCE"] and run["head_branch"]=="main"
          assert run["path"]==".github/workflows/candidate.yml" and run["status"]=="completed"
          jobs=json.loads((root/"original-jobs.json").read_text())["jobs"]
          expected={"native / native (ubuntu-24.04)","native / native (windows-latest)","quality / verify","quality / wordpress-coding-standards","quality / rust-dependencies","vault / windows","vault / linux","publish"}
          assert len(jobs)==len(expected)+1 and {j["name"] for j in jobs}==expected|{"public_release"}
          assert all(j["conclusion"]=="success" for j in jobs if j["name"] in expected)
          draft=json.loads((root/"original-draft.json").read_text())
          assert draft["id"]==460105848 and draft["draft"] is True
          assert draft["tag_name"]=="v8.1.5-online" and draft["target_commitish"]==os.environ["SOURCE"]
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Crawlvora-verified-non-distribution-candidate
          path: candidate-assets
          github-token: ${{ github.token }}
          run-id: '45929260255'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Crawlvora-Web
          path: web-assets
          github-token: ${{ github.token }}
          run-id: '45929260255'
      - name: Reconstruct and verify the already uploaded packages
        run: |
          python tools/public_release.py public-assets --candidate candidate-assets --web web-assets --source "$SOURCE" --version "$VERSION"
          python tools/public_release.py public-assets --remote "$RUNNER_TEMP/original-draft.json"
      - name: Promote existing verified draft by release ID
        run: bash tools/publish_public_release.sh public-assets "$VERSION" "$SOURCE" /dev/null
