name: Native Tauri packages
on:
  pull_request:
  push:
    branches: [registry-only-desktop, main]
    paths: ['desktop/**', 'windows/**', 'linux/**', '*.py', 'static/**', 'frontend/**', 'tools/**', 'tests/**', 'requirements*.txt', 'package*.json', 'tsconfig*.json', 'VERSION', '.github/workflows/native.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      publish_artifacts:
        type: boolean
        default: false
      registry_bundle:
        type: boolean
        default: false
      national_bundle:
        type: boolean
        default: false
      edition:
        type: string
        default: ''
      language:
        type: string
        default: en
      artifact_suffix:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Reserve disk space for offline catalog builds
        if: runner.os == 'Linux' && (inputs.registry_bundle || inputs.national_bundle)
        run: |
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h .
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev xvfb
      - run: rustup update stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.toml', 'desktop/src-tauri/Cargo.lock') }}
      - name: Compile TypeScript frontend
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit; else npm install --ignore-scripts --no-audit; fi
          npm run typecheck
          npm run build:frontend
      - run: python -m pip install -r requirements.txt -r requirements-native-build.txt pip-audit
      - run: python -m pip check
      - name: Native build dependency vulnerability audit
        run: python -m pip_audit --strict
      - run: python -m unittest discover -s tests -v
      - name: Resolve Rust dependency lock
        working-directory: desktop/src-tauri
        shell: bash
        run: test -f Cargo.lock || cargo +stable generate-lockfile
      - name: Build the native host
        working-directory: desktop/src-tauri
        run: cargo +stable test --release --locked
      - name: Compile native executable
        working-directory: desktop/src-tauri
        run: cargo +stable build --release --locked
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: inputs.registry_bundle
        with:
          name: verified-public-registry-snapshot
          path: registry-bundle
      - name: Accept distribution snapshot
        if: inputs.registry_bundle
        shell: bash
        run: |
          set -euo pipefail
          cd registry-bundle
          sha256sum -c SHA256SUMS.txt
          cd ..
          python -c "import json; from pathlib import Path; from registry_bundle import verify_bundle; root=Path('registry-bundle'); report=verify_bundle(root/'registry-seed.sqlite3'); expected=json.loads((root/'registry-seed.json').read_text(encoding='utf-8')); report==expected or __import__('sys').exit('Registry manifest mismatch'); print(report)"
          cd registry-bundle
          sha256sum registry-seed.sqlite3 | cut -d ' ' -f 1 > registry-seed.sha256
          echo 'CRAWLVORA_REGISTRY_BUNDLE=1' >> "$GITHUB_ENV"
          echo "CRAWLVORA_EXPECTED_REGISTRY_SHA256=$(cat registry-seed.sha256)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: inputs.national_bundle
        with:
          name: verified-gb-registry-snapshot
          path: national-data/GB
      - name: Accept GB bundle identity
        if: inputs.national_bundle
        shell: bash
        run: |
          python -c "from national_catalog import NationalCatalog; from pathlib import Path; import tempfile; t=tempfile.TemporaryDirectory(); n=NationalCatalog(Path('.'),Path(t.name)); p,m=n.database(); print(m['rows']); t.cleanup()"
          echo 'CRAWLVORA_NATIONAL_BUNDLE=1' >> "$GITHUB_ENV"
          echo "CRAWLVORA_EXPECTED_GB_SHA256=$(python -c 'import json; print(json.load(open("national-data/GB/manifest.json"))["database_sha256"])')" >> "$GITHUB_ENV"
      - name: Build worker and assemble preview
        env:
          SELECTED_EDITION: ${{ inputs.edition }}
          SELECTED_LANGUAGE: ${{ inputs.language || 'en' }}
        shell: bash
        run: |
          extra=()
          if [ "${CRAWLVORA_REGISTRY_BUNDLE:-}" = 1 ]; then
            extra=(--add-data "registry-bundle/registry-seed.sqlite3:." --add-data "registry-bundle/registry-seed.sha256:." --add-data "registry-bundle/registry-seed.json:.")
          fi
          if [ "${CRAWLVORA_NATIONAL_BUNDLE:-}" = 1 ]; then
            test -s national-data/GB/manifest.json
            test -s national-data/GB/united-kingdom.sqlite3.gz
            extra+=(--add-data "national-data:national-data")
          fi
          if [ -n "$SELECTED_EDITION" ]; then
            mkdir -p native-edition
            python -c 'import json,os; print(json.dumps({"edition":os.environ["SELECTED_EDITION"],"language":os.environ["SELECTED_LANGUAGE"]}))' > native-edition/edition.json
            extra+=(--add-data "native-edition/edition.json:.")
          elif [ "${CRAWLVORA_REGISTRY_BUNDLE:-}" != 1 ] && [ "${CRAWLVORA_NATIONAL_BUNDLE:-}" != 1 ]; then
            mkdir -p native-edition
            printf '%s\n' '{"edition":"Online"}' > native-edition/edition.json
            extra+=(--add-data "native-edition/edition.json:.")
          else
            extra+=(--add-data "tvrtk_output.csv:.")
          fi
          python -m PyInstaller "${extra[@]}" --noconfirm --clean --onedir --console --name CrawlvoraWorker --add-data "static:static" --exclude-module playwright --exclude-module webview tvrtk_scraper.py
          mkdir -p native-preview
          cp -R dist/CrawlvoraWorker native-preview/worker
          if [ "$RUNNER_OS" = Windows ]; then
            cp desktop/src-tauri/target/release/crawlvora-desktop.exe native-preview/Crawlvora.exe
          else
            cp desktop/src-tauri/target/release/crawlvora-desktop native-preview/Crawlvora
          fi
      - name: Packaged worker forced-restart acceptance (Windows)
        if: runner.os == 'Windows' && inputs.registry_bundle != true && inputs.national_bundle != true
        run: python tools/native_worker_recovery.py --worker native-preview/worker/CrawlvoraWorker.exe
      - name: Packaged worker forced-restart acceptance (Linux)
        if: runner.os == 'Linux' && inputs.registry_bundle != true && inputs.national_bundle != true
        run: python tools/native_worker_recovery.py --worker native-preview/worker/CrawlvoraWorker
      - name: Native window smoke test (Linux)
        if: runner.os == 'Linux'
        run: WEBKIT_DISABLE_COMPOSITING_MODE=1 timeout 900 xvfb-run -a native-preview/Crawlvora --native-smoke
      - name: Native window smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path native-preview/Crawlvora.exe).Path -ArgumentList '--native-smoke' -PassThru
          if (!$p.WaitForExit(900000)) { Stop-Process -Id $p.Id -Force; throw 'Native smoke timed out' }
          if ($p.ExitCode -ne 0) { throw 'Native smoke failed' }
      - name: Measure native smoke startup and CPU (Windows)
        if: runner.os == 'Windows' && inputs.registry_bundle != true && inputs.national_bundle != true
        run: python tools/native_startup_check.py native-preview/Crawlvora.exe --output native-startup.json
      - name: Measure native smoke startup and CPU (Linux)
        if: runner.os == 'Linux' && inputs.registry_bundle != true && inputs.national_bundle != true
        run: WEBKIT_DISABLE_COMPOSITING_MODE=1 xvfb-run -a python tools/native_startup_check.py native-preview/Crawlvora --output native-startup.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.registry_bundle != true && inputs.national_bundle != true
        with:
          name: native-startup-${{ runner.os }}${{ inputs.artifact_suffix }}
          path: native-startup.json
          if-no-files-found: error
          retention-days: 7
      - name: Build and smoke-test standalone portable and installer
        if: runner.os == 'Windows'
        env:
          SELECTED_EDITION: ${{ inputs.edition }}
          SELECTED_LANGUAGE: ${{ inputs.language || 'en' }}
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE) { throw 'Inno Setup installation failed' }
          if ($env:SELECTED_EDITION) {
            ./windows/package-native.ps1 -Edition $env:SELECTED_EDITION -Language $env:SELECTED_LANGUAGE
          } elseif ('${{ inputs.registry_bundle }}' -eq 'true' -and '${{ inputs.national_bundle }}' -eq 'true') {
            foreach ($edition in @('Full','HR','GB','Online')) { ./windows/package-native.ps1 -Edition $edition }
          } elseif ('${{ inputs.registry_bundle }}' -eq 'true' -or '${{ inputs.national_bundle }}' -eq 'true') {
            ./windows/package-native.ps1
            ./windows/package-native.ps1 -Edition Online
          } else {
            ./windows/package-native.ps1 -Edition Online
          }
      - name: Archive tested Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release-assets
          tar -czf release-assets/Crawlvora-Linux-x86_64.tar.gz -C native-preview .
          mkdir -p /tmp/crawlvora-extracted
          tar -xzf release-assets/Crawlvora-Linux-x86_64.tar.gz -C /tmp/crawlvora-extracted
          WEBKIT_DISABLE_COMPOSITING_MODE=1 timeout 900 xvfb-run -a /tmp/crawlvora-extracted/Crawlvora --native-smoke
          bash linux/package.sh
          sudo apt-get install -y ./release-assets/Crawlvora-Linux-amd64.deb
          WEBKIT_DISABLE_COMPOSITING_MODE=1 timeout 900 xvfb-run -a /usr/bin/crawlvora --native-smoke
          sudo apt-get remove -y crawlvora
      - name: Rust dependency vulnerability audit
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: |
          cargo +stable install cargo-audit --version 0.23.0 --locked
          cargo audit
      - name: Print Windows installer diagnostics
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path release-assets/native-install.log) { Get-Content release-assets/native-install.log -Tail 100 }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure() && runner.os == 'Windows' && inputs.publish_artifacts == true
        with:
          name: Windows-installer-diagnostics${{ inputs.artifact_suffix }}
          retention-days: 7
          path: release-assets/native-install.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: inputs.publish_artifacts == true
        with:
          retention-days: 7
          name: Crawlvora-native-${{ runner.os }}${{ inputs.artifact_suffix }}
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always() && inputs.publish_artifacts == true
        with:
          retention-days: 7
          name: Rust-lock-${{ runner.os }}${{ inputs.artifact_suffix }}
          path: desktop/src-tauri/Cargo.lock
          if-no-files-found: warn
